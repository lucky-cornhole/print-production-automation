name: Lucky Bags Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lucky-bags-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Lucky Bags Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo, sqlite3, pdo_sqlite, tokenizer, xml, ctype, fileinfo
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies for validation
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Laravel application
        run: php artisan about

      - name: Build production dependencies
        run: |
          rm -rf vendor
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LB_PRODUCTION_FTP_SERVER }}
          username: ${{ secrets.LB_PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.LB_PRODUCTION_FTP_PASSWORD }}
          protocol: ftp
          port: 21

          # FTP account is already rooted at:
          # /home2/antspixa/public_html/x_dev/luckyprodauto/prod
          local-dir: ./
          server-dir: ./

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/node_modules/**
            **/database/*.sqlite
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/automation/.venv/**
            **/automation/.env
            **/automation/logs/**
            **/automation/factory_print/**
            **/automation/dist/**
            **/service-account.json
            **/factory_print/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/*.log