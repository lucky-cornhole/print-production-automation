name: Production Cloud Test

on:
  workflow_dispatch:

jobs:
  production-test:
    runs-on: ubuntu-latest
    env:
      LB_SHOP: h0yf1i-yt.myshopify.com
      SHOPIFY_API_VERSION: "2026-07"
      GOOGLE_DRIVE_ROOT_FOLDER_ID: 1WINKlgMI9U6PXzwoyWx4cN8iB4l-Q5lt
      LB_CLIENT_ID: ${{ secrets.LB_CLIENT_ID }}
      LB_CLIENT_SECRET: ${{ secrets.LB_CLIENT_SECRET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only discovery
        run: python discover.py

      - name: Run artwork matcher
        run: python matcher.py

      - name: Show summary
        run: |
          echo "=== AUDIT REPORT ==="
          cat output/AUDIT_REPORT.md
          echo ""
          echo "=== MATCH REPORT SUMMARY ==="
          head -n 20 output/MATCH_REPORT.md

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: production-cloud-test-${{ github.run_number }}
          path: |
            output/AUDIT_REPORT.md
            output/MATCH_REPORT.md
            output/artwork_matches.json
            output/drive_files.json
            output/shopify_line_items.json
          retention-days: 7
