name: Production Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    env:
      LB_SHOP: h0yf1i-yt.myshopify.com
      SHOPIFY_API_VERSION: "2026-07"
      GOOGLE_DRIVE_ROOT_FOLDER_ID: 1WINKlgMI9U6PXzwoyWx4cN8iB4l-Q5lt
      LB_CLIENT_ID: ${{ secrets.LB_CLIENT_ID }}
      LB_CLIENT_SECRET: ${{ secrets.LB_CLIENT_SECRET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull Shopify and Drive data
        run: python discover.py
      - name: Match production artwork
        run: python matcher.py
      - name: Build GitHub Pages
        run: python build_pages.py
      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "Refresh production dashboard [skip ci]"
            git push
          fi
